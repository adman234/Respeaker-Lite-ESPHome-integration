# Brick Assistant: shared body for ReSpeaker Lite (XIAO ESP32-S3) satellites.
#
# Pulled in by the thin per-device files in config/devices/. A device file sets the
# substitutions below plus its own API key, and can append extra wake word models.
#
# Layout (see readme/brick-assistant-notes.md):
#   1. upstream formatBCE packages at a pinned tag: the ReSpeaker Lite hardware and the
#      satellite core (base, voice assistant, media player, timers and alarm).
#      Upstream's packages/lite/device.yaml and packages/core/controls.yaml are NOT
#      used: the Brick has its own wiring and button behaviour.
#   2. packages/brick/device.yaml: Brick wiring, LED state machine, buttons, siren.
#   3. this file: device identity and network, and the behaviour overrides.
#
# Overriding an upstream automation: ESPHome appends lists, so an automation written
# as a plain action list here runs AFTER upstream's actions. To REPLACE upstream's
# automation instead, write it in dict form (`on_x:` then `then:`): a dict replaces a
# list outright. This relies on upstream using the list form; check after each bump.
# (A `!remove` cannot do it: packages are flattened and merged from the top down, so a
# lower package's `!remove` is overwritten by the higher layer that re-adds the key.)
#
# To move to a newer upstream release, change BOTH `ref:` below and
# `respeaker_lite_ref`, then compile both devices.

substitutions:
  # Required from the device file
  name: respeaker-lite
  friendly_name: ReSpeaker Lite
  # Fallback hotspot name shown when Wi-Fi is unreachable. Make it unique per device.
  ap_ssid: "Respeaker-Lite Hotspot"
  # Upstream tag used for its sounds, models and XMOS firmware. Keep equal to `ref:`.
  respeaker_lite_ref: 2026.10.4

packages:
  upstream:
    url: https://github.com/formatBCE/Respeaker-Lite-ESPHome-integration
    ref: 2026.10.4
    refresh: 1d
    files:
      - packages/respeaker-lite/hardware.yaml
      - packages/core/base.yaml
      - packages/core/voice-assistant.yaml
      - packages/core/media-player.yaml
      - packages/core/timers-alarm.yaml
  brick_device: !include ../../packages/brick/device.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: diycraic.brick_assistant
    version: 2026.11.1
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    - priority: -100
      then:
        # micro_wake_word has finished setup by now, so the stored slider value can be pushed
        # into the custom models.
        - script.execute: apply_custom_wake_word_cutoff
        # Re-sync the wake word engine from the restored select, in case its on_value ran
        # before voice_assistant was set up.
        - lambda: |-
            auto idx = id(wake_word_engine_location).active_index();
            id(ha_wake_word) = idx.has_value() && *idx == 1;
            id(va).set_use_wake_word(id(ha_wake_word));

logger:
  level: DEBUG
  initial_level: WARN

api:
  # ESPHome reboots the device after this long without an API client (default 15 min).
  # That is shorter than the nightly Home Assistant backup window, so the speakers used
  # to reboot mid-backup. 60 min outlasts it and still recovers a speaker whose API has
  # genuinely hung.
  reboot_timeout: 60min

ota:
  - platform: esphome

wifi:
  use_address: ${name}.local
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  output_power: 12.5 # Decrease TX power to ~12 dBm (helps with wifi stability for some reason)
  ap:
    ssid: ${ap_ssid}
    password: !secret respeaker_ap_password

captive_portal:

############################
# AUDIO (mono speaker)
############################
speaker:
  - id: !extend i2s_audio_speaker
    channel: mono # The Brick has a single speaker
    buffer_duration: 500ms
  - id: !extend mixing_speaker
    num_channels: 1

media_player:
  - id: !extend external_media_player
    media_pipeline:
      num_channels: 1
    volume_min: 0.3
    volume_max: 0.8

############################
# MICRO WAKE WORD
############################
micro_wake_word:
  models:
    # 0.4 (manifest default 0.5): at 0.2 the residual TTS echo through the XMOS AEC
    # self-triggered and cut responses off.
    - id: !extend stop
      probability_cutoff: 0.4
  vad:
    probability_cutoff: 0.1
  # Dict form: replaces upstream's handler (see the header).
  on_wake_word_detected:
   then:
    # With the engine set to "In Home Assistant", only the internal "Stop" and "Snooze"
    # models act here. The selected on-device model keeps running as a shadow and only
    # logs, so the two engines can be compared on the same audio.
    - if:
        condition:
          lambda: return id(ha_wake_word) && wake_word != "Stop" && wake_word != "Snooze";
        then:
          - logger.log:
              level: WARN
              format: "Shadow on-device wake word (ignored, engine is In Home Assistant): %s"
              args: [ 'wake_word.c_str()' ]
        else:
          - if:
              condition:
                switch.is_on: mic_mute_switch
              then:
                - logger.log:
                    level: INFO
                    format: "Wake word ignored: microphone is muted"
              else:
                - logger.log:
                    format: "Wake word was: %s"
                    args: [ 'wake_word.c_str()' ]
                - script.execute:
                    id: send_wake_word_event
                    wake_word: !lambda return wake_word;
                # A ringing timer or alarm: any wake word stops it, "Snooze" snoozes it
                # (upstream). No new turn starts.
                - if:
                    condition:
                      switch.is_on: timer_ringing
                    then:
                      - if:
                          condition:
                            lambda: return wake_word == "Snooze";
                          then:
                            - script.execute: snooze_ring
                          else:
                            - switch.turn_off: timer_ringing
                    else:
                      # Barge-in: stop the running turn and its reply, then start a new turn.
                      - if:
                          condition:
                            voice_assistant.is_running:
                          then:
                            - voice_assistant.stop:
                      - if:
                          condition:
                            media_player.is_announcing:
                              id: external_media_player
                          then:
                            - media_player.stop:
                                id: external_media_player
                                announcement: true
                      - if:
                          condition:
                            lambda: return wake_word != "Stop" && wake_word != "Snooze";
                          then:
                            - if:
                                condition:
                                  lambda: return id(voice_assistant_phase) != ${voice_assist_not_ready_phase_id};
                                then:
                                  - lambda: |-
                                      id(wake_pending) = true;
                                      id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
                                  - script.execute: control_leds
                                  - if:
                                      condition:
                                        switch.is_on: wake_sound
                                      then:
                                        - script.execute:
                                            id: play_sound
                                            priority: true
                                            sound_file: "wake_word_triggered_sound"
                                        - delay: 300ms
                                        - wait_until:
                                            timeout: 3s
                                            condition:
                                              not:
                                                media_player.is_announcing:
                                                  id: external_media_player
                                  - voice_assistant.start:
                                      wake_word: !lambda return wake_word;
                                      silence_detection: true
                                  - script.execute: wake_word_start_hook
                                  - lambda: id(wake_pending) = false;
                                else:
                                  - delay: 1s
                                  - script.execute:
                                      id: play_sound
                                      priority: true
                                      sound_file: "connection_problem_sound"
                          else:
                            - logger.log: "Stop wake word was used!"
                            - script.execute:
                                id: led_feedback_flash
                                kind: ${led_feedback_stop_word}
                                duration_ms: 300
    # "Stop" ended the continuous stream; resume it (no-op when on device)
    - script.execute: start_ha_wake_word

############################
# VOICE ASSISTANT
############################
# Upstream's handlers stay; the plain lists below are appended to them. on_start and
# on_end are in dict form and replace upstream's (see the header).
voice_assistant:
  noise_suppression_level: 1
  auto_gain: 31dBFS

  on_client_connected:
    # Runs in both modes: in HA mode the on-device "stop" word still works.
    - script.execute: start_ha_wake_word

  on_error:
    # A follow-up round (the reply ended in a question, so Home Assistant said
    # continue_conversation) that heard nothing. ESPHome only clears its continue-conversation
    # flag in request_stop(), and an error does not call it. In HA mode the device then restarts
    # its continuous stream without the wake word flag, so every ~16 s a new listen-for-speech
    # round opens, forever. voice_assistant.stop clears the flag; start_ha_wake_word resumes
    # normal wake word streaming (the same pair the "stop" word uses).
    - if:
        condition:
          lambda: return code == "stt-no-text-recognized";
        then:
          - voice_assistant.stop:
          - script.execute: start_ha_wake_word

  on_start:
   then:
    # In HA mode every run starts by waiting for the wake word, so duck on detection instead.
    - if:
        condition:
          lambda: return !id(ha_wake_word);
        then:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 20
              duration: 0.0s

  # Only fires when Home Assistant detected the wake word (engine location "In Home Assistant").
  # STT is already running, so the chime is not waited for (the XMOS AEC removes it).
  on_wake_word_detected:
    - logger.log: "VA: wake word detected by Home Assistant"
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 20
        duration: 0.0s
    - if:
        condition:
          switch.is_on: timer_ringing
        then:
          - switch.turn_off: timer_ringing
    - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
    - script.execute: control_leds
    - script.execute:
        id: send_wake_word_event
        wake_word: "Home Assistant"
    - if:
        condition:
          switch.is_on: wake_sound
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: "wake_word_triggered_sound"

  # Continuous (HA) mode only: fires each time a turn is fully over (reply played, or the run
  # ended/errored) just before streaming for the next wake word resumes. Does the job that
  # on_end does in on-device mode.
  on_idle:
    - if:
        condition:
          lambda: return id(ha_wake_word);
        then:
          - script.execute: ha_turn_over

  on_stt_end:
    # Also covers pipelines that end STT without a VAD end event.
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: control_leds

  on_end:
   then:
    # In HA mode is_running stays true between turns (continuous streaming), so the wait
    # below would never finish; on_idle does this job there.
    - if:
        condition:
          lambda: return !id(ha_wake_word);
        then:
          - wait_until:
              not:
                voice_assistant.is_running
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 0
              duration: 1.0s
          # Leave the error animation up for a moment
          - if:
              condition:
                lambda: return id(voice_assistant_phase) == ${voice_assist_error_phase_id};
              then:
                - delay: 1s
          # With streaming TTS, on_end fires when the stream ends, not when the audio buffer
          # drains. Keep the replying LED on until playback ends.
          - wait_until:
              timeout: 60s
              condition:
                not:
                  media_player.is_announcing:
                    id: external_media_player
          # A barge-in may have started a new turn meanwhile (or be in its chime gap):
          # leave that turn's model and LED alone.
          - if:
              condition:
                and:
                  - not:
                      voice_assistant.is_running:
                  - lambda: return !id(wake_pending);
              then:
                - if:
                    condition:
                      switch.is_off: timer_ringing
                    then:
                      - micro_wake_word.disable_model: stop
                - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
                - script.execute: control_leds
